apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: generator
spec:
  image: alugand/flink:2.0.8
  flinkVersion: v2_0
  flinkConfiguration:
    state.backend.type: "rocksdb"
    taskmanager.numberOfTaskSlots: "4"
  serviceAccount: flink
  podTemplate:
    apiVersion: v1
    kind: Pod
    metadata:
      name: pod-template
    spec:
      containers:
        - name: flink-main-container
          ports:
            - containerPort: 9249
              name: prom
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    podTemplate:
      spec:
        nodeSelector:
          tier: kafka
  taskManager:
    resource:
      memory: "2048m"
      cpu: 4
    podTemplate:
      spec:
        nodeSelector:
          tier: kafka
  job:
    jarURI: https://raw.githubusercontent.com/alugand/flink-justin/main/forst-benchmark/target/Generator.jar
    args:
      - "--src-rate"
      - "50000"
    parallelism: 4
