prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    nodeSelector:
      tier: manager
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchLabels:
        prometheus-monitor: "true"
grafana:
  service:
    type: NodePort
    nodePort: 30300
  nodeSelector:
    tier: manager
kube-state-metrics:
  nodeSelector:
    tier: manager